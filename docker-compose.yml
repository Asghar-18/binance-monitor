services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://monitor:${POSTGRES_PASSWORD}@db:5432/monitor
    depends_on:
      db:
        condition: service_healthy
    # Not published: only the dashboard talks to the backend.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in .env}
      DASHBOARD_TOTP_SECRET: ${DASHBOARD_TOTP_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    depends_on:
      - backend
    ports:
      # Only reachable from the machine itself. On a server, use the https profile below.
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env to use the https profile}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
